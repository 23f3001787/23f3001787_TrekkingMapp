{% extends "base.html" %}
{% block navbar %}{% endblock %}
{% block content %}

<div class="auth-wrapper">
    <div class="auth-card shadow-soft">
        <div class="text-center mb-4">
            <h3 class="fw-bold text-brand">Login</h3>
            <p class="text-muted">Sign in To Join the Adventure !</p>
        </div>
        <!--error msg-->
        {% if error %}
        <div class="alert alert-danger py-2 border-0 shadow-sm text-center">{{ error }}</div>
        {% endif %}
        <form action="/login" method="POST">
            <div class="mb-3">
                <label class="form-label fw-semibold">Email Address</label>
                <input type="email" name="email" class="auth-input" placeholder="Enter Your Email" required>
            </div>
            <div class="mb-4">
                <label class="form-label fw-semibold">
                    Password
                </label>
                <input type="password" name="password" class="auth-input" placeholder="Enter Your Password" required>

            </div>
            <button type="submit" class="btn btn-brand btn-lg w-100 fw-bold rounded-pill shadow-sm">
                Login
            </button>

        </form>
        <div class="text-center mt-4">
            <p class="text-muted">Don't Have an Account? <a href='/register'
                    class="text-brand text-decoration-none fw-semibold">
                    Register
                </a></p>
        </div>

    </div>
</div>

{% endblock %}
