{% extends 'base.html' %}
{% block navbar %}{% endblock %}
{% block content %}

<div class="dashboard-wrapper d-flex align-items-center justify-content-center" style="min-height: 80vh;">

    <div class="card border-0 shadow-lg rounded-5 text-center" style="max-width: 500px; width: 100%; opacity: 0.98;">
        
        <!-- Header Banner -->
        <div class="bg-danger text-white py-4">
            <i class="bi bi-exclamation-triangle-fill display-4"></i>
            <h2 class="fw-bold mt-2 mb-0">Account Suspended</h2>
        </div>

        <div class="card-body p-5 bg-white">

            <h5 class="text-dark fw-bold mb-3">You have been blacklisted from TrekkingMax.</h5>
            <p class="text-muted mb-4">
                Your account access has been revoked by an Administrator
            </p>
            
                <p class="text-muted small fw-semibold mb-1">Kindly appeal via email at:</p>
                
                <a href="mailto:support@trekmax.com" class="fs-5 fw-bold text-danger text-decoration-none">support@trekmax.com</a>
            

            <a href="/login" class="btn btn-outline-danger rounded-pill fw-bold w-100 shadow-sm py-2">
                <i class="bi bi-box-arrow-in-right me-2"></i>Return to Login
            </a>

        </div>
    </div>
</div>
{% endblock %}
