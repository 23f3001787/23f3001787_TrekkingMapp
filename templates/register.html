{% extends 'base.html' %}
{% block navbar %}{% endblock %}
{% block content %}

<div class="auth-wrapper">
    <div class="auth-card shadow-soft">

        <div class="text-center mb-4">
            <h3 class="fw-bold text-brand">Join TrekkingMax</h3>
            <p class="text-muted">Start your next adventure today.</p>
        </div>

        {% if error %}
        <div class="alert alert-danger py-2 border-0 shadow-sm text-center">{{ error }}</div>
        {% endif %}

        <form action="/register" method="POST">
            <div class="mb-3">
                <label class="form-label fw-semibold">Username</label>
                <input type="text" name="username" class="auth-input" placeholder="Choose a username" required>
            </div>

            <div class="mb-3">
                <label class="form-label fw-semibold">Email Address</label>
                <input type="email" name="email" class="auth-input" placeholder="Enter your email" required>
            </div>
            <div class="mb-3">
                <label class="form-label fw-semibold">Joining As</label>
                <select name="role" class="auth-input form-select" required>
                    <option value="trekker">Trekker</option>
                    <option value="staff">Trek Staff</option>
                </select>
            </div>


            <div class="mb-4">
                <label class="form-label fw-semibold">Password</label>
                <input type="password" name="password" class="auth-input" placeholder="Create a password" required>
            </div>

            <button type="submit" class="btn btn-brand btn-lg w-100 fw-bold rounded-pill shadow-sm">
                Create Account
            </button>
        </form>

        <div class="text-center mt-4">
            <p class="text-muted">Already have an account? <a href="/login"
                    class="text-brand text-decoration-none fw-semibold">Login here</a></p>
        </div>

    </div>
</div>

{% endblock %}
