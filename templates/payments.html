{% extends "base.html" %}
{% block navbar %}{% endblock %}

{% block content %}

<div class="auth-wrapper position-relative">

    <div class="position-absolute top-0 start-0 p-4">
        <a href="/" class="btn btn-light shadow-sm rounded-pill fw-bold" style="z-index: 10;">
            <i class="bi bi-x-lg me-2 text-danger"></i>Cancel Payment
        </a>
    </div>

    <div class="auth-card shadow-soft">
        <div class="text-center mb-4">
            <h3 class="fw-bold text-brand"><i class="bi bi-credit-card-2-front me-2"></i>Secure Checkout</h3>
            <p class="text-muted">You are booking: <strong>{{ booking.trek.name }}</strong></p>
        </div>

        <form action="/process_payment/{{ booking.id }}" method="POST">
            <div class="mb-3">
                <label class="form-label fw-semibold">Name on Card</label>
                <input type="text" class="auth-input" value="{{ current_user.username }}" disabled>
            </div>

            <div class="mb-4">
                <label class="form-label fw-semibold">Card Number (Simulated)</label>
                <input type="text" class="auth-input" value="**** **** **** 2828" disabled>
            </div>

            <button type="submit" class="btn btn-brand btn-lg w-100 fw-bold rounded-pill shadow-sm">
                Confirm & Pay
            </button>
        </form>
        
    </div>
</div>
{% endblock %}
